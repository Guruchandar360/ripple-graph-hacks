[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-incident"
version = "0.1.0"
description = "Evidence-driven incident recovery with FalkorDB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "falkordb>=1.0,<2", "google-genai>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["ripple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real FalkorDB instance"]

[tool.ruff]
line-length = 110

