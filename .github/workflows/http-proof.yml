name: Real model through HTTP API
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    env:
      MODEL_PROVIDER: ollama
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_TOOL_MODE: json
      RUN_TIMEOUT_SECONDS: "300"
      GLOBAL_DAILY_RUNS: "100"
      WORKSPACE_DAILY_RUNS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --wait
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          python -c 'import json,os,urllib.request; r=urllib.request.Request("http://127.0.0.1:11434/api/pull",data=json.dumps({"model":os.environ["OLLAMA_MODEL"],"stream":False}).encode(),headers={"Content-Type":"application/json"}); print(urllib.request.urlopen(r,timeout=600).read().decode())'
          mkdir -p artifacts/http-proof
          python -m uvicorn ripple.main:app --host 127.0.0.1 --port 8000 > artifacts/http-proof/server.log 2>&1 &
      - run: python -m ripple.http_smoke --restart-database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-proof
          path: artifacts/http-proof/
